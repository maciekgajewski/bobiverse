name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements-astronomy.txt
      - name: Install npm dependencies
        run: npm ci
      - name: Install Python dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements-astronomy.txt
      - name: Validate task metadata
        run: python3 scripts/tasks.py check
      - name: Check formatting
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit and component tests
        run: npm run test
      - name: Python pipeline tests
        run: npm run data:test
      - name: Validate runtime data
        run: npm run data:validate
      - name: Production build
        run: npm run build

  e2e:
    name: Playwright (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install npm dependencies
        run: npm ci
      - name: Install browser and system dependencies
        run: npx playwright install --with-deps "${{ matrix.browser }}"
      - name: Verify virtual display dependencies
        run: |
          if ! command -v xvfb-run >/dev/null || ! command -v xauth >/dev/null; then
            sudo apt-get update
            sudo apt-get install --yes xvfb xauth
          fi
      - name: Browser interaction tests
        run: npm run test:e2e -- --project="${{ matrix.browser }}" --workers=1 --retries=1
      - name: Preserve browser failure reports
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-${{ matrix.browser }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 3
